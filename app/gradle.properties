org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# 本机工程路径含非 ASCII 字符（…\Desktop\KSU临时模块\…），AGP 默认拒绝构建。
# AGP 官方开关，见 http://b.android.com/95744。
# 注意：若 ndk-build 在中文路径下仍出错，请把工程复制到纯 ASCII 目录再编译。
android.overridePathCheck=true

# SudoBox targets Android 12+ (minSdk 31).
# 决策变更 (2026-09-03)：由 D3 原定的 Android 10+ (API 29) 上抬至 API 31，
# 理由：minSdk 31 使 Android 12+ 动态取色（Material You）成为全量可用路径，
# 去掉 29-30 的降级分支与兼容测试面；目标设备（KernelSU root 机型）实际均为 Android 12+。
minSdkVersion=31
targetSdkVersion=35
compileSdkVersion=35
ndkVersion=29.0.14206865
