# SudoBox distro descriptor — Ubuntu
#
# 实现说明：设计稿（发行版支持设计 §5）用 YAML 描述；设备端用 POSIX sh 可 source
# 的 KV 表达同一字段集（id/name/libc/init_class/pkg_family/source/post_unpack/mirrors），
# 语义等价、零解析依赖。新增发行版 = 新增一个目录，引擎与 UI 零改动。

DISTRO_NAME="Ubuntu"
DISTRO_ID="ubuntu"
LIBC="glibc"
INIT_CLASS="A"              # 保留 /etc/init.d（sysv-rc）
PKG_FAMILY="apt"
DEFAULT_SUITE="noble"
SOURCE_KIND="tarball"       # 渠道 A：ubuntu-base 官方 tarball 直下（约 30MB）
SOURCE_URL_TEMPLATE="https://cdimage.ubuntu.com/ubuntu-base/releases/{SUITE}/release/ubuntu-base-{VERSION}-base-{ARCH}.tar.gz"
ARCH_MAP="aarch64=arm64 x86_64=amd64 armv7l=armhf"
SUITE_VERSION_MAP="focal=20.04 jammy=22.04 mantic=23.10 noble=24.04 plucky=25.04"
POST_UNPACK="seccomp-off-apt dns hosts"
MIRROR_official="https://cdimage.ubuntu.com"
MIRROR_tuna="https://mirrors.tuna.tsinghua.edu.cn"
MIRROR_ustc="https://mirrors.ustc.edu.cn"
MIRROR_aliyun="https://mirrors.aliyun.com"
NOTES="arm64 走 ubuntu-ports（非 archive）；ubuntu-base 极简，需自装 ssh/net-tools"
LAST_VERIFIED="2026-09-07"
