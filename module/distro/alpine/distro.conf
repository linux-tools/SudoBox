# SudoBox distro descriptor — Alpine Linux
DISTRO_NAME="Alpine Linux"
DISTRO_ID="alpine"
LIBC="musl"                 # 注意：少数闭源二进制在 musl 下不可用
INIT_CLASS="A"              # OpenRC 原生（/etc/init.d）
PKG_FAMILY="apk"
DEFAULT_SUITE="latest-stable"   # 官方最新稳定指针（2026-09 实测四镜像 200，跟随上游自动升级，不会 EOL 失效）
SOURCE_KIND="tarball"       # 渠道 A：alpine-minirootfs 直下（约 3MB）
SOURCE_URL_TEMPLATE="https://dl-cdn.alpinelinux.org/alpine/{SUITE}/releases/{ARCH}/alpine-minirootfs-{VERSION}-{ARCH}.tar.gz"
ARCH_MAP="aarch64=aarch64 x86_64=x86_64 armv7l=armv7"
POST_UNPACK="dns hosts apk-repos"
MIRROR_official="https://dl-cdn.alpinelinux.org"
MIRROR_tuna="https://mirrors.tuna.tsinghua.edu.cn"
MIRROR_aliyun="https://mirrors.aliyun.com"
MIRROR_ustc="https://mirrors.ustc.edu.cn"
NOTES="musl libc；apk 无 seccomp 沙箱问题；体积最小，最适合快速验证闭环"
LAST_VERIFIED="2026-09-07"
