# SudoBox distro descriptor — 模板（新增发行版 = 复制本目录并填写）
#
# 字段语义（对应 SudoBox-发行版支持设计.md §5）：
#   DISTRO_NAME / DISTRO_ID : 展示名与标识
#   LIBC                    : glibc | musl
#   INIT_CLASS              : A=init.d/OpenRC 可用  B=systemd 单栖（服务走裸进程）
#   PKG_FAMILY              : apt | apk | pacman | dnf | emerge | unknown
#   SOURCE_KIND             : tarball（渠道A）| debootstrap（渠道A）| oci（渠道B）| import（渠道C）
#   SOURCE_URL_TEMPLATE     : 支持 {SUITE} {VERSION} {ARCH} 占位符
#   ARCH_MAP                : uname -m -> 发行版架构标识
#   SUITE_VERSION_MAP       : suite 代号 -> 版本号的映射（可选）
#   POST_UNPACK             : 解压后钩子列表（include/hooks/*.sh，空格分隔）
#   MIRROR_<name>           : 镜像前缀（official/tuna/aliyun/ustc/...）
#   NOTES / LAST_VERIFIED   : 说明与最后验证日期（滚动发行需定期重验）
#
# 可选：同目录放 distro.sh，定义 distro_resolve_url <suite> <arch> <mirror>
#       用于 URL 需动态解析的发行版（如 Alpine 的 patch 版本号）

DISTRO_NAME="Template Distro"
DISTRO_ID="template"
LIBC="glibc"
INIT_CLASS="A"
PKG_FAMILY="unknown"
DEFAULT_SUITE="stable"
SOURCE_KIND="tarball"
SOURCE_URL_TEMPLATE="https://example.org/{SUITE}/rootfs-{ARCH}.tar.xz"
ARCH_MAP="aarch64=arm64 x86_64=amd64"
SUITE_VERSION_MAP=""
POST_UNPACK="dns hosts"
MIRROR_official="https://example.org"
NOTES="模板，勿直接使用"
LAST_VERIFIED=""
