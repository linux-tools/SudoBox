# SudoBox distro descriptor — Kali Linux (NetHunter rootfs)
DISTRO_NAME="Kali Linux"
DISTRO_ID="kali"
LIBC="glibc"
INIT_CLASS="A"
PKG_FAMILY="apt"
DEFAULT_SUITE="current"
SOURCE_KIND="tarball"       # 渠道 A：官方 NetHunter kalifs（专为 Android chroot 构建）
SOURCE_URL_TEMPLATE="https://kali.download/nethunter-images/current/rootfs/kali-nethunter-rootfs-full-{ARCH}.tar.xz"   # v0.1.17: 旧 kalifs-* 文件名已失效（2026-09-07 实测 404）
ARCH_MAP="aarch64=arm64 x86_64=amd64 armv7l=armhf"
POST_UNPACK="seccomp-off-apt dns hosts"
MIRROR_official="https://kali.download"
MIRROR_tuna="https://mirrors.tuna.tsinghua.edu.cn"
NOTES="kalifs-full 体积约 1.5GB+；滚动发行，体积增长快；建议 SD 卡/大存储设备"
LAST_VERIFIED="2026-09-07"
