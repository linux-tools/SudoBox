# SudoBox distro descriptor — Debian
#
# 状态说明（诚实标注，不夸大）：
#   Debian 无官方 base tarball（不像 ubuntu-base / alpine-minirootfs）。
#   官方正统渠道是 debootstrap 两阶段（--foreign + --second-stage），
#   需要把 debootstrap 资产 vendor 进模块（P1 任务，尚未内置）。
#
#   当前可用路径：
#     1) PC 侧预生成后导入（推荐）：
#          debootstrap --foreign --arch=arm64 bookworm ./rootfs http://mirrors.tuna.tsinghua.edu.cn/debian/
#          （拷贝至手机）chroot-mgr install --import rootfs.tar --name debian-bookworm
#     2) 等 P1 内置 debootstrap 资产后 'chroot-mgr install debian bookworm' 可用
#
#   描述符保留完整字段，引擎会在渠道未实现时给出明确错误（不静默失败）。
DISTRO_NAME="Debian GNU/Linux"
DISTRO_ID="debian"
LIBC="glibc"
INIT_CLASS="A"
PKG_FAMILY="apt"
DEFAULT_SUITE="bookworm"
SOURCE_KIND="debootstrap"   # 渠道 A（debootstrap 两阶段），设备端尚未内置
SOURCE_URL_TEMPLATE=""
ARCH_MAP="aarch64=arm64 x86_64=amd64 armv7l=armhf"
SUITE_VERSION_MAP="bullseye=11 bookworm=12 trixie=13 sid=unstable"
POST_UNPACK="seccomp-off-apt dns hosts"
MIRROR_official="http://deb.debian.org/debian/"
MIRROR_tuna="https://mirrors.tuna.tsinghua.edu.cn/debian/"
MIRROR_aliyun="https://mirrors.aliyun.com/debian/"
MIRROR_ustc="https://mirrors.ustc.edu.cn/debian/"
NOTES="O6 首发目标；设备端 debootstrap 待 P1 内置。当前请用 install --import"
LAST_VERIFIED="2026-09-03"
